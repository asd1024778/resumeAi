# 集成测试使用 H2 内存库，无需启动 MySQL
spring.datasource.url=jdbc:h2:mem:resume_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

jwt.secret=test-jwt-secret-key-at-least-32-bytes-long
jwt.expiration-ms=86400000

spring.ai.deepseek.api-key=test-dummy-key
spring.ai.deepseek.base-url=https://api.deepseek.com/

app.sensitive.storage=memory
app.demo-data.enabled=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

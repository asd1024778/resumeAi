# 本地开发：仅启动 MySQL + Redis（后端/前端在本机 mvn / npm 运行）
# ★ 全栈一键部署请用项目根目录：cd .. && docker compose up -d --build
#
# 启动：docker compose up -d
# 停止：docker compose down
#
# 宿主机端口（本机 3306 = MySQL80 服务、6379 = WSL 里的 Redis，所以默认错开）：
#   MySQL  3307 -> 容器 3306   Redis  6380 -> 容器 6379
# 本机跑后端时要显式指定：MYSQL_PORT=3307、REDIS_PORT=6380
# 想换端口：MYSQL_HOST_PORT=xxxx REDIS_HOST_PORT=xxxx docker compose up -d
#
# 镜像源（Docker Hub 直连不通时）：MYSQL_IMAGE=docker.1panel.live/library/mysql:8.0

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    container_name: resume-io-mysql
    restart: unless-stopped
    ports:
      # 宿主机 3306 若已被本机 MySQL80 占用，这里默认映射到 3307
      - "${MYSQL_HOST_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: resume_db
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    container_name: resume-io-redis
    restart: unless-stopped
    ports:
      # 宿主机 6379 可能已被 WSL / 原生 Redis 占用，默认映射到 6380
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mysql_data:
  redis_data:

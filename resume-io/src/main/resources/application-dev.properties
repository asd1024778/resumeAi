# 本地开发备用：无需 MySQL 即可启动 JPA（mvn spring-boot:run "-Dspring-boot.run.profiles=dev"）
spring.datasource.url=jdbc:h2:mem:resume_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

logging.level.com.resume=debug

# 开发环境无 Redis 时使用内存存储
app.sensitive.storage=memory
app.sms.storage=memory
app.demo-data.enabled=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

# ==================== 基础配置 ====================
spring.application.name=resume-io
server.port=8080

# ==================== AI 大模型配置 ====================
# 使用前请设置环境变量 DASHSCOPE_API_KEY（DeepSeek API Key）
spring.ai.deepseek.api-key=${DASHSCOPE_API_KEY:}
spring.ai.deepseek.base-url=https://api.deepseek.com/
spring.ai.deepseek.chat.options.model=deepseek-v4-flash
spring.ai.deepseek.chat.options.temperature=0.7

# ==================== WebFlux 文件上传 ====================
spring.http.codecs.max-in-memory-size=10MB

# ==================== MySQL 数据库 ====================
# MySQL 未启动时会报 Communications link failure，请先启动 MySQL80 服务，
# 或使用 dev 配置：mvn spring-boot:run "-Dspring-boot.run.profiles=dev"
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:resume_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==================== JWT ====================
jwt.secret=${JWT_SECRET:dev-jwt-secret-key-at-least-32-bytes-long}
jwt.expiration-ms=86400000

# ==================== RAG 检索增强 ====================
app.rag.top-k=5
app.rag.embedding=local

# ==================== 演示数据 ====================
app.demo-data.enabled=${APP_DEMO_DATA:true}

# ==================== 敏感资料存储（Redis 动态管理 + API 脱敏） ====================
# storage=redis 时完整敏感资料存 Redis；storage=memory 时使用内存（开发/测试）
app.sensitive.storage=${SENSITIVE_STORAGE:redis}
app.sensitive.redis-ttl-days=30
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

# ==================== 日志 ====================
logging.level.com.resume=info
logging.level.org.springframework.security=info

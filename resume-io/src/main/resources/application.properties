# ==================== 基础配置 ====================
spring.application.name=resume-io
server.port=8080

# ==================== AI 大模型配置（DeepSeek） ====================
# 密钥来源优先级：DEEPSEEK_API_KEY > DASHSCOPE_API_KEY（历史变量名，兼容保留）
# 安全约定：密钥只允许放在环境变量 / 未纳入版本控制的 .env 中，
#          绝不写进本文件、源码、Dockerfile 或 compose 的明文环境变量里。
#          启动时 AiConfig 只会打印脱敏值（如 sk-1234****cdef）。
# 配置示例见项目根目录 .env.example
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY:${DASHSCOPE_API_KEY:}}
spring.ai.deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com/}
# 当前可用的 DeepSeek 模型（GET https://api.deepseek.com/models）：
#   deepseek-flash   （通用，快，默认）
#   deepseek-v4-pro  （更强，慢）
# 也可用环境变量覆盖：DEEPSEEK_MODEL=deepseek-v4-pro
spring.ai.deepseek.chat.options.model=${DEEPSEEK_MODEL:deepseek-flash}
spring.ai.deepseek.chat.options.temperature=0.7

# ==================== WebFlux 文件上传 ====================
spring.http.codecs.max-in-memory-size=10MB

# ==================== MySQL 数据库 ====================
# MySQL 未启动时会报 Communications link failure，请先启动 MySQL80 服务，
# 或使用 dev 配置：mvn spring-boot:run "-Dspring-boot.run.profiles=dev"
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:resume_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==================== JWT ====================
jwt.secret=${JWT_SECRET:dev-jwt-secret-key-at-least-32-bytes-long}
jwt.expiration-ms=86400000

# ==================== RAG 检索增强 ====================
app.rag.top-k=5
app.rag.embedding=local

# ==================== 演示数据 ====================
app.demo-data.enabled=${APP_DEMO_DATA:true}

# ==================== 短信验证码（手机号注册） ====================
# 存储：redis（默认，多实例共享）| memory（dev/无 Redis 环境）
app.sms.storage=${SMS_STORAGE:redis}
# 验证码有效期（秒）
app.sms.code-ttl-seconds=300
# 同一手机号重新发送的最小间隔（秒），前端用于倒计时
app.sms.resend-interval-seconds=60
# 单个验证码允许的最大错误次数，超限作废需重新获取
app.sms.max-verify-attempts=5
# 开发期把验证码随响应回传，方便无短信网关时联调；
# 接入真实网关后改为 false（或设置环境变量 SMS_DEBUG_RETURN_CODE=false）
app.sms.debug-return-code=${SMS_DEBUG_RETURN_CODE:true}

# ==================== 敏感资料存储（Redis 动态管理 + API 脱敏） ====================
# storage=redis 时完整敏感资料存 Redis；storage=memory 时使用内存（开发/测试）
app.sensitive.storage=${SENSITIVE_STORAGE:redis}
app.sensitive.redis-ttl-days=30
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

# ==================== 日志 ====================
logging.level.com.resume=info
logging.level.org.springframework.security=info
